packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false

# Approve these native deps' postinstall build scripts (sharp powers Next image
# optimization; unrs-resolver is Next's module resolver). Explicit allowlist so
# pnpm stops prompting on install.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
